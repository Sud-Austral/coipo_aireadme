    origen: "[PENDIENTE] quien lo entrego y cuando"
    contiene_pii: "no aplica: son tres dependencias con version fija"
    puede_versionarse: true
    uso: "Declara todo lo que el sistema necesita para correr: cliente HTTP, lectura de configuracion y pruebas."

  - ruta: api.json
    sha256: "133f054d76f27ffa6d6387e88b04f9d2b26b4b39b52c43045a9f64fccd49d32e"
    origen: "[PENDIENTE] quien lo entrego y cuando"
    contiene_pii: "[VERIFICAR] archivo de configuracion corto que el proceso de redaccion carga [makeReadme.py]. Los archivos que describen como llegar a un servicio externo son el sitio donde aparece una credencial por descuido. No se abrio para revisarlo"
    puede_versionarse: "[VERIFICAR] queda en false si contiene_pii se confirma; en ese caso la ruta tiene que quedar ignorada con barra inicial y hoy no consta que lo este"
    uso: "[INFERIDO] parametros de acceso al servicio de modelo de lenguaje que redacta; el proceso lo carga al arrancar [makeReadme.py]."

  - ruta: .aireadme.yml.example
    sha256: "a1bd657b120ab0c9ef8b42925df283ad662fd0cf38575c7e1116384625d9ff8f"
    origen: "[PENDIENTE] quien lo entrego y cuando"
    contiene_pii: "no se detectaron patrones de dato personal; es una plantilla"
    puede_versionarse: true
    uso: "Ejemplo de la configuracion opcional que un repositorio puede declarar sobre si mismo. Lo que declara se trata como testimonio y no como inferencia [readme_config.py]."

  - ruta: fleet/catalogo.json
    sha256: "fd56b999db300fce449aeba62de50a4c8c7b42a55054d7190a97e8ace6823420"
    origen: "[PENDIENTE] quien lo entrego y cuando"
    contiene_pii: "[VERIFICAR] es el resultado del censo de la flota y ocupa cerca de 48 kB. Describe repositorios, incluidos los privados, que el inventario cuenta aparte [fleet_card.py]. No hay dato de persona esperable, pero si informacion sobre sistemas internos que quiza no deberia estar en un repositorio publico"
    puede_versionarse: "[VERIFICAR] depende de si el repositorio es publico y de que se considere divulgable del inventario interno"
    uso: "Inventario de la flota producido por el censo. Es dato derivado, no fuente."

  - ruta: fleet/CATALOGO.md
    sha256: "528c20a300649cb6785afa73882f56d142fa9397efee6e550dc1f8d4464567cc"
    origen: "[PENDIENTE] quien lo entrego y cuando"
    contiene_pii: "[VERIFICAR] version legible del catalogo, con la misma consideracion que el anterior. El propio codigo tiene una verificacion de que no se filtre lo que no corresponde [fleet_card.py]"
    puede_versionarse: "[VERIFICAR] misma consideracion que el catalogo en JSON"
    uso: "Catalogo publicable de la flota."

