notas:
  - "Ninguna entrada tiene resuelto el campo origen: en ningun repositorio esta escrito quien entrego un archivo ni cuando."
  - "Los modulos de codigo y los archivos de prueba no se listan uno a uno: no son insumos ni datos, son el sistema."
  - "Este repositorio no recibe datos de nadie. Lo que consume lo lee de otros repositorios en tiempo de ejecucion, y eso no queda versionado aqui salvo por el catalogo de la flota."
  - "El unico hallazgo del manifiesto es api.json: un archivo de configuracion de acceso a un servicio externo versionado en un repositorio publico, sin que conste que este ignorado con ancla. Hay que abrirlo y decidir."
