name: Generate README

'on':
  workflow_call:

jobs:

  test:
    name: Test AI README
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify Python
        run: |
          python --version

      - name: Verify readme3.py
        run: |
          python -m py_compile readme3.py

      - name: Verify makeReadme.py
        run: |
          python -m py_compile makeReadme.py

      - name: Success
        run: |
          echo "======================================"
          echo "AI README reusable workflow OK"
          echo "======================================"