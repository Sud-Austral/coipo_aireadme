name: Generate README

on:
  workflow_call:

jobs:
  generate-readme:
    name: Generate and update README
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      # --------------------------------------------------
      # 1. Descargar el repositorio que llama
      # --------------------------------------------------

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Descargar el repositorio maestro
      # --------------------------------------------------

      - name: Checkout AI README
        uses: actions/checkout@v4
        with:
          repository: Sud-Austral/coipo_aireadme
          path: ai-readme

      # --------------------------------------------------
      # 3. Configurar Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 4. Instalar dependencias
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # --------------------------------------------------
      # 5. Verificar repositorios
      # --------------------------------------------------

      - name: Verify repositories
        run: |
          echo "======================================"
          echo "TARGET REPOSITORY"
          echo "======================================"
          ls -la target

          echo ""
          echo "======================================"
          echo "AI README REPOSITORY"
          echo "======================================"
          ls -la ai-readme

      # --------------------------------------------------
      # 6. Verificar archivos del sistema AI README
      # --------------------------------------------------

      - name: Verify AI README files
        run: |
          echo "======================================"
          echo "PYTHON FILES"
          echo "======================================"

          ls -la ai-readme/*.py

          echo ""
          echo "======================================"
          echo "API CONFIGURATION"
          echo "======================================"

          if [ ! -f "ai-readme/api.json" ]; then
            echo "ERROR: No existe ai-readme/api.json"
            exit 1
          fi

          echo "api.json encontrado."

      # --------------------------------------------------
      # 7. Verificar Python
      # --------------------------------------------------

      - name: Verify Python
        run: |
          python --version

      # --------------------------------------------------
      # 8. Verificar sintaxis de los scripts
      # --------------------------------------------------

      - name: Verify scripts
        run: |
          python -m py_compile ai-readme/readme3.py
          python -m py_compile ai-readme/makeReadme.py

          echo "Scripts Python válidos."

      # --------------------------------------------------
      # 9. Generar README
      # --------------------------------------------------

      - name: Generate README
        run: |
          echo "======================================"
          echo "GENERANDO README"
          echo "======================================"

          python ai-readme/makeReadme.py target

      # --------------------------------------------------
      # 10. Verificar README generado
      # --------------------------------------------------

      - name: Verify generated README
        run: |
          echo "======================================"
          echo "VERIFICANDO README"
          echo "======================================"

          if [ ! -f "target/README.md" ]; then
            echo "ERROR: makeReadme.py no generó README.md"
            exit 1
          fi

          echo "README.md generado correctamente."

          echo ""
          echo "Tamaño:"
          wc -c target/README.md

          echo ""
          echo "Primeras 80 líneas:"
          head -80 target/README.md

      # --------------------------------------------------
      # 11. Verificar contexto generado
      # --------------------------------------------------

      - name: Verify README context
        run: |
          echo "======================================"
          echo "README CONTEXT"
          echo "======================================"

          if [ -d "target/readme_context" ]; then
            find target/readme_context -maxdepth 2 -type f -print
          else
            echo "ADVERTENCIA: no existe readme_context/"
          fi

      # --------------------------------------------------
      # 12. Mostrar estado Git
      # --------------------------------------------------

      - name: Show Git status
        run: |
          cd target

          echo "======================================"
          echo "GIT STATUS"
          echo "======================================"

          git status --short

      # --------------------------------------------------
      # 13. Mostrar cambios del README
      # --------------------------------------------------

      - name: Show README diff
        run: |
          cd target

          echo "======================================"
          echo "README DIFF"
          echo "======================================"

          git diff -- README.md

      # --------------------------------------------------
      # 14. Crear Pull Request
      # --------------------------------------------------

      - name: Create README Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target

          echo "======================================"
          echo "PREPARANDO PULL REQUEST"
          echo "======================================"

          # -----------------------------------------------
          # Verificar si README cambió
          # -----------------------------------------------

          if git diff --quiet -- README.md; then
            echo "README.md no tiene cambios."
            exit 0
          fi

          # -----------------------------------------------
          # Obtener rama base
          # -----------------------------------------------

          BASE_BRANCH="${GITHUB_REF_NAME}"
          UPDATE_BRANCH="ai-readme/update-readme"

          echo "Rama base: $BASE_BRANCH"
          echo "Rama actualización: $UPDATE_BRANCH"

          # -----------------------------------------------
          # Configurar Git
          # -----------------------------------------------

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -----------------------------------------------
          # Crear rama de actualización
          # -----------------------------------------------

          git checkout -B "$UPDATE_BRANCH"

          # -----------------------------------------------
          # Agregar README
          # -----------------------------------------------

          git add README.md

          # -----------------------------------------------
          # Crear commit
          # -----------------------------------------------

          git commit -m "docs: update README automatically"

          # -----------------------------------------------
          # Push de la rama
          # -----------------------------------------------

          git push origin "$UPDATE_BRANCH" --force

          echo ""
          echo "Rama de actualización enviada correctamente."

          # -----------------------------------------------
          # Buscar PR existente
          # -----------------------------------------------

          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$UPDATE_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          # -----------------------------------------------
          # Crear PR si no existe
          # -----------------------------------------------

          if [ -n "$PR_NUMBER" ]; then

            echo ""
            echo "======================================"
            echo "PR YA EXISTENTE"
            echo "======================================"

            echo "Pull Request #$PR_NUMBER ya existe."
            echo "La rama fue actualizada."

          else

            echo ""
            echo "======================================"
            echo "CREANDO PULL REQUEST"
            echo "======================================"

            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "docs: actualización automática del README" \
              --body "## README generado automáticamente

Este Pull Request fue generado automáticamente por el sistema AI README.

### Qué se hizo

- Analizó la estructura actual del repositorio.
- Generó una nueva versión de README.md.
- Comparó los cambios contra la versión existente.
- Publicó los cambios en una rama independiente.
- Abrió este Pull Request para revisión.

### Importante

Este workflow no modifica directamente la rama principal.

El cambio debe ser revisado y aprobado antes de realizar el merge.

### Archivo modificado

- README.md

---

🤖 Generado automáticamente por AI README")

            echo ""
            echo "======================================"
            echo "PULL REQUEST CREADO"
            echo "======================================"
            echo "$PR_URL"

          fi
