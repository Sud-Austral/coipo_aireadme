name: Generate README

on:
  workflow_call:
    inputs:

      engine_ref:
        description: >
          Version del motor a ejecutar. El stub de cada repositorio la
          declara junto al `uses:`, para que la referencia fije tanto este
          YAML como el codigo Python que se descarga mas abajo.
          Si viene vacia se usa la rama por defecto del hub.
        type: string
        required: false
        default: ""

      insumos:
        description: >
          Reconstruir insumos/ desde el codigo: 00-PROBLEMA.md,
          01-SOLUCION.md y MANIFIESTO.yaml. Es un artefacto pesado y de vida
          larga, que se corrige a mano, asi que no se regenera en cada push.
        type: boolean
        required: false
        default: false

jobs:
  generate-readme:
    name: Generate and validate README

    # ------------------------------------------------------------------
    # ALCANCE: solo repositorios cuyo nombre empieza con "coipo".
    #
    # Dentro de un workflow reutilizable, el contexto `github` es SIEMPRE el
    # del repositorio que LLAMA, no el de este repositorio. Por eso
    # `github.repository` vale "Sud-Austral/<repo-llamante>".
    #
    # `startsWith()` no distingue mayusculas de minusculas, asi que esta
    # unica clausula cubre tanto coipo_* como COIPO_*.
    #
    # Un job cuya condicion es falsa no recibe runner y no consume minutos.
    #
    # IMPORTANTE: si algun dia se agrega un segundo job a este workflow, hay
    # que repetir esta guarda en el (o encadenarlo con `needs:`), porque
    # `if` es por job y no existe a nivel de workflow.
    # ------------------------------------------------------------------
    if: startsWith(github.repository, 'Sud-Austral/coipo')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:

      # --------------------------------------------------
      # 1. Descargar el repositorio que llama
      # --------------------------------------------------

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Descargar el repositorio maestro AI README
      # --------------------------------------------------

      # --------------------------------------------------
      # Resolver la version publicada del motor
      #
      # El stub invoca este workflow con una referencia fija (@v1), pero eso
      # solo fija ESTE archivo YAML. El codigo Python se descarga en el paso
      # siguiente, y un checkout sin `ref:` baja la rama por defecto: el tag
      # congelaba el workflow mientras el motor seguia viniendo de main.
      #
      # No se puede derivar la referencia desde el contexto: se verifico que
      # `github.job_workflow_ref` llega VACIO en las expresiones (solo existe
      # en los claims del token OIDC). Por eso el stub la declara de forma
      # explicita y esta es la unica fuente de verdad.
      # --------------------------------------------------

      - name: Resolver version del motor
        id: motor
        run: |
          VERSION="${{ inputs.engine_ref }}"

          if [ -z "$VERSION" ]; then
            echo "AVISO: el stub no declara engine_ref."
            echo "Se usara la rama por defecto del hub, que puede no coincidir"
            echo "con la version del workflow que se esta ejecutando."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Motor a descargar: ${VERSION:-<rama por defecto>}"

      - name: Checkout AI README
        uses: actions/checkout@v4
        with:
          repository: Sud-Austral/coipo_aireadme
          path: ai-readme
          fetch-depth: 1
          ref: ${{ steps.motor.outputs.version }}

      # --------------------------------------------------
      # 3. Configurar Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 4. Instalar dependencias
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Desde requirements.txt y no `pip install requests` suelto: el
          # hub se despliega a la flota por tag, asi que una dependencia
          # flotante convierte cualquier release upstream en un cambio no
          # revisado en todos los repositorios en alcance.
          pip install -r ai-readme/requirements.txt

      # --------------------------------------------------
      # 5. Verificar repositorios
      # --------------------------------------------------

      - name: Verify repositories
        run: |
          echo "======================================"
          echo "TARGET REPOSITORY"
          echo "======================================"

          ls -la target

          echo ""
          echo "======================================"
          echo "AI README REPOSITORY"
          echo "======================================"

          ls -la ai-readme

      # --------------------------------------------------
      # 6. Verificar archivos del sistema AI README
      # --------------------------------------------------

      - name: Verify AI README files
        run: |
          echo "======================================"
          echo "AI README FILES"
          echo "======================================"

          required_files=(
            "ai-readme/readme3.py"
            "ai-readme/makeReadme.py"
            "ai-readme/validate_readme.py"
            "ai-readme/api.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: No existe $file"
              exit 1
            fi

            echo "OK: $file"
          done

      # --------------------------------------------------
      # 7. Verificar Python
      # --------------------------------------------------

      - name: Verify Python
        run: |
          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python --version

      # --------------------------------------------------
      # 8. Verificar sintaxis de los scripts
      # --------------------------------------------------

      - name: Verify scripts
        run: |
          echo "======================================"
          echo "PYTHON SYNTAX"
          echo "======================================"

          python -m py_compile ai-readme/readme3.py
          python -m py_compile ai-readme/makeReadme.py
          python -m py_compile ai-readme/validate_readme.py

          echo ""
          echo "Todos los scripts Python son válidos."

      # --------------------------------------------------
      # 9. Verificar api.json
      # --------------------------------------------------

      - name: Verify API configuration
        run: |
          echo "======================================"
          echo "API CONFIGURATION"
          echo "======================================"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ai-readme/api.json")

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              print(f"ERROR: api.json inválido: {exc}")
              raise SystemExit(1)

          if not data.get("apikey"):
              print("ERROR: api.json no contiene 'apikey'.")
              raise SystemExit(1)

          if not data.get("model"):
              print("ERROR: api.json no contiene 'model'.")
              raise SystemExit(1)

          print("api.json válido.")
          print(f"Modelo configurado: {data['model']}")
          PY

      # --------------------------------------------------
      # 10. Generar README
      # --------------------------------------------------

      - name: Generate README
        run: |
          echo "======================================"
          echo "GENERANDO README"
          echo "======================================"

          BANDERAS=""
          if [ "${{ inputs.insumos }}" = "true" ]; then
            BANDERAS="--insumos"
          fi

          python ai-readme/makeReadme.py target $BANDERAS

      # --------------------------------------------------
      # 11. Verificar README generado
      # --------------------------------------------------

      - name: Verify generated README
        run: |
          echo "======================================"
          echo "VERIFICANDO README"
          echo "======================================"

          # No exigir README.md: el contrato con el humano tiene salidas
          # legitimas que no escriben nada, y un repositorio con
          # <!-- ai-readme:lock --> y sin README rompia el job aqui.
          if [ ! -f "target/README.md" ]; then
            echo "No hay README.md."
            echo "Es correcto si el contrato decidio no escribir nada;"
            echo "el informe de la corrida explica por que."
            exit 0
          fi

          if [ ! -s "target/README.md" ]; then
            echo "AVISO: README.md existe pero esta vacio."
            exit 0
          fi

          echo "README.md presente."

          echo ""
          echo "Tamaño:"
          wc -c target/README.md

          echo ""
          echo "Primeras 100 líneas:"
          head -100 target/README.md

      # --------------------------------------------------
      # 12. Verificar README candidato
      # --------------------------------------------------

      - name: Verify README candidate
        run: |
          echo "======================================"
          echo "README CANDIDATE"
          echo "======================================"

          if [ -f "target/README_CANDIDATE.md" ]; then
            echo "README_CANDIDATE.md encontrado."

            echo ""
            echo "Tamaño:"
            wc -c target/README_CANDIDATE.md
          else
            echo "No existe README_CANDIDATE.md."
            echo "Se considera normal si makeReadme.py "
            echo "lo elimina o no lo conserva."
          fi

      # --------------------------------------------------
      # 13. Verificar evidencia generada
      # --------------------------------------------------

      - name: Verify README evidence
        run: |
          echo "======================================"
          echo "README EVIDENCE"
          echo "======================================"

          required_files=(
            "target/readme_context/README_EVIDENCE.json"
            "target/readme_context/README_CONTEXT_ULTRA.md"
            "target/readme_context/repository_analysis.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: No existe $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo ""
          echo "Archivos de evidencia generados correctamente."

      # --------------------------------------------------
      # 14. Validar JSON de evidencia
      # --------------------------------------------------

      - name: Validate README evidence JSON
        run: |
          echo "======================================"
          echo "VALIDANDO EVIDENCIA JSON"
          echo "======================================"

          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path(
                  "target/readme_context/README_EVIDENCE.json"
              ),
              Path(
                  "target/readme_context/repository_analysis.json"
              ),
          ]

          for path in files:
              try:
                  json.loads(
                      path.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"ERROR: JSON inválido en {path}: {exc}"
                  )
                  raise SystemExit(1)

              print(f"OK: {path}")

          PY

      # --------------------------------------------------
      # 15. Mostrar resumen de evidencia
      # --------------------------------------------------

      - name: Show evidence summary
        run: |
          echo "======================================"
          echo "RESUMEN DE EVIDENCIA"
          echo "======================================"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "target/readme_context/README_EVIDENCE.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          metadata = data.get(
              "metadata",
              {}
          )

          print(
              f"Repositorio: "
              f"{metadata.get('repository', 'N/D')}"
          )

          print(
              f"Archivos: "
              f"{metadata.get('file_count', 0)}"
          )

          print(
              f"Tecnologías: "
              f"{len(data.get('technologies', {}))}"
          )

          print(
              f"Variables de entorno: "
              f"{len(data.get('environment_variables', []))}"
          )

          print(
              f"Endpoints: "
              f"{len(data.get('api', []))}"
          )

          print(
              f"Tablas: "
              f"{len(data.get('database_tables', []))}"
          )

          print(
              f"Señales funcionales: "
              f"{len(data.get('capability_signals', {}))}"
          )
          PY

      # --------------------------------------------------
      # 16. Mostrar estado Git
      # --------------------------------------------------

      - name: Show Git status
        run: |
          cd target

          echo "======================================"
          echo "GIT STATUS"
          echo "======================================"

          git status --short

      # --------------------------------------------------
      # 17. Mostrar diff README
      # --------------------------------------------------

      - name: Show README diff
        run: |
          cd target

          echo "======================================"
          echo "README DIFF"
          echo "======================================"

          git diff -- README.md

      # --------------------------------------------------
      # Informe al resumen de la ejecucion
      #
      # Va SIEMPRE, tambien cuando el contrato con el humano decide no
      # modificar nada. En ese caso no hay diff, y sin diff no hay pull
      # request: sin esto la evidencia y la propuesta se perderian.
      # --------------------------------------------------

      - name: Publicar informe en el resumen
        if: always()
        run: |
          if [ -f target/readme_report.md ]; then
            cat target/readme_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Sin informe" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "La corrida no llego a generar el informe." >> "$GITHUB_STEP_SUMMARY"
          fi

      # --------------------------------------------------
      # Que rutas entran al pull request
      #
      # add-paths no tolera una ruta que no existe: `git add` corta con
      # "fatal: pathspec ... did not match any files" y se pierde el PR
      # entero. Y varias de estas rutas son opcionales por diseno:
      # delete_files.md solo se escribe si hay candidatos, e insumos/ solo
      # si se pidio.
      #
      # Paso por el que fallo la primera demostracion real.
      # --------------------------------------------------

      - name: Rutas que entran al pull request
        id: rutas
        run: |
          : > rutas_del_pr.txt

          for ruta in README.md delete_files.md insumos; do
            if [ -e "target/$ruta" ]; then
              echo "$ruta" >> rutas_del_pr.txt
              echo "incluye: $ruta"
            else
              echo "omite:   $ruta (no existe)"
            fi
          done

          {
            echo "lista<<FIN_DE_LISTA"
            cat rutas_del_pr.txt
            echo "FIN_DE_LISTA"
          } >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 18. Crear Pull Request
      # --------------------------------------------------

      - name: Create README Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          path: target

          branch: ai-readme/update-readme
          delete-branch: true

          # Solo el README entra al PR.
          #
          # Sin esto, cada PR arrastraba README_CANDIDATE.md y los tres
          # archivos de readme_context/ (unas 1.300 lineas de JSON) al
          # repositorio destino. Ese JSON quedaba commiteado y, en la corrida
          # siguiente, el escaner lo leia como si fuera codigo del proyecto.
          add-paths: ${{ steps.rutas.outputs.lista }}

          commit-message: "docs: update README automatically"

          title: "docs: actualización automática del README"

          # El cuerpo sale del informe que genera makeReadme.py: que se
          # hizo, con que evidencia y que quedo sin verificar. Antes era un
          # texto fijo que describia el proceso y era identico en los 57
          # repositorios.
          body-path: target/readme_report.md

          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      # --------------------------------------------------
      # 19. Mostrar resultado del Pull Request
      # --------------------------------------------------

      - name: Show Pull Request result
        run: |
          echo "======================================"
          echo "RESULTADO PULL REQUEST"
          echo "======================================"

          echo "Operación:"
          echo "${{ steps.create-pr.outputs.pull-request-operation }}"

          echo ""
          echo "Número:"
          echo "${{ steps.create-pr.outputs.pull-request-number }}"

          echo ""
          echo "URL:"
          echo "${{ steps.create-pr.outputs.pull-request-url }}"

          echo ""
          echo "Rama:"
          echo "${{ steps.create-pr.outputs.pull-request-branch }}"

          echo ""
          echo "======================================"