name: Barrido de la flota

# ======================================================================
# Alcanza los repositorios dormidos.
#
# El generador solo actuaba con un push a main, asi que los repositorios
# sin actividad —que suelen ser los peor documentados— no se alcanzaban
# nunca. Este workflow los despierta.
#
# Solo DISPARA. No genera nada por su cuenta: cada repositorio ejecuta su
# propio stub, con sus propios permisos y su propio historial. Se descarto
# el modo alternativo (clonar el repositorio ajeno desde aqui y abrir el
# pull request en su nombre) porque exige un token con escritura sobre toda
# la organizacion y duplica el camino de generacion sin ninguna ganancia.
#
# EL CRON ESTA DESACTIVADO A PROPOSITO.
#
# Se enciende cuando haya medida de cuanto cuesta y cuantos pull requests
# produce un lote real. Hasta entonces, a mano y con lotes pequenos.
# ======================================================================

on:
  workflow_dispatch:
    inputs:

      batch_size:
        description: Cuantos repositorios despertar
        type: string
        required: false
        default: "5"

      dry_run:
        description: Solo listar a quien se despertaria
        type: boolean
        required: false
        default: true

      incluir_rechazados:
        description: >
          Incluir repositorios que cerraron un pull request del bot sin
          fusionarlo. Por defecto se respeta esa respuesta.
        type: boolean
        required: false
        default: false

  # schedule:
  #   - cron: "0 6 * * 1"   # lunes 06:00 UTC. Ver la nota de arriba.

permissions:
  contents: read

jobs:

  seleccionar:
    name: Elegir a quien despertar
    runs-on: ubuntu-latest

    outputs:
      matriz: ${{ steps.elegir.outputs.matriz }}
      cuantos: ${{ steps.elegir.outputs.cuantos }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seleccionar
        id: elegir
        env:
          GH_FLEET_TOKEN: ${{ secrets.GH_FLEET_TOKEN }}
        run: |
          if [ -z "$GH_FLEET_TOKEN" ]; then
            echo "ERROR: falta el secreto GH_FLEET_TOKEN."
            echo "Necesita permiso de lectura sobre los repositorios de la"
            echo "organizacion y de escritura sobre Actions para disparar."
            exit 1
          fi

          EXTRA=""
          if [ "${{ inputs.incluir_rechazados }}" = "true" ]; then
            EXTRA="--incluir-rechazados"
          fi

          python fleet_select.py \
            --limite "${{ inputs.batch_size }}" \
            --json $EXTRA > seleccion.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("seleccion.json", encoding="utf-8") as archivo:
              datos = json.load(archivo)

          elegidos = datos["seleccionados"]

          print(f"cuantos={len(elegidos)}")
          print(
              "matriz="
              + json.dumps(
                  {"include": [
                      {"repo": e["repo"], "rama": e["default_branch"]}
                      for e in elegidos
                  ]}
              )
          )
          PY

      - name: Resumen de la seleccion
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("seleccion.json", encoding="utf-8") as archivo:
              datos = json.load(archivo)

          print("## Barrido de la flota")
          print()
          print(f"- En alcance: **{datos['total']}**")
          print(f"- Seleccionados: **{len(datos['seleccionados'])}**")
          print(f"- Sin instrumentar: {len(datos['sin_stub'])}")
          print(f"- Con rechazo previo, no se insiste: {len(datos['rechazados'])}")
          print()
          print("| Repositorio | README | Ultimo push | |")
          print("| --- | ---: | --- | --- |")

          for fila in datos["seleccionados"]:
              marca = "marcador de posicion" if fila["placeholder"] else ""
              print(
                  f"| `{fila['nombre']}` | {fila['readme_bytes']} B "
                  f"| {(fila['pushed_at'] or '')[:10]} | {marca} |"
              )

          if datos["rechazados"]:
              print()
              print("### No se vuelven a proponer")
              print()
              print(
                  "Alguien cerro un pull request del bot sin fusionarlo. "
                  "Eso es una respuesta."
              )
              print()
              for fila in datos["rechazados"]:
                  print(f"- `{fila['nombre']}`")
          PY

  despertar:
    name: Despertar
    needs: seleccionar
    if: ${{ inputs.dry_run == false && needs.seleccionar.outputs.cuantos != '0' }}
    runs-on: ubuntu-latest

    strategy:
      # Deliberadamente bajo: los repositorios comparten una sola clave del
      # modelo, y lanzarlos todos a la vez provoca 429 en cadena.
      max-parallel: 3
      fail-fast: false
      matrix: ${{ fromJSON(needs.seleccionar.outputs.matriz) }}

    steps:

      - name: Disparar el generador
        env:
          GH_TOKEN: ${{ secrets.GH_FLEET_TOKEN }}
        run: |
          echo "Despertando ${{ matrix.repo }} en ${{ matrix.rama }}"

          gh workflow run readme.yml \
            -R "${{ matrix.repo }}" \
            --ref "${{ matrix.rama }}"
